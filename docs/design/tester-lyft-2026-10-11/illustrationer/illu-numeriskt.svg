<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <!-- Numeriskt. Säger: läs av, räkna, under tid. En tabell 3x3 med tal antydda som streck, en cell markerad med mjuk yta, en klocka i hörnet och en kopparfylld svarsruta. -->
