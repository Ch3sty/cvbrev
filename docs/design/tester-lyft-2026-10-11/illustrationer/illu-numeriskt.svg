  <rect x="74" y="42" width="28" height="20" rx="4" fill="var(--illu-mjuk)"/>
  <path d="M40 16v72M72 16v72M8 40h96M8 64h96" stroke="var(--illu-dim)" stroke-width="2.5"/>
  <!-- talen -->
  <path d="M16 28h14M48 28h12M80 28h14M16 52h10M48 52h16M16 76h16M48 76h10M80 76h16" stroke="var(--illu-dim)" stroke-width="3"/>
