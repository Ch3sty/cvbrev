<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <!-- Scenen i introduktionen. Säger: vägen från ansökan via test till intervju. Ett spår i dämpad kontur, ansökan som blad, provbladet med den ifyllda cellen i koppar (lutar 6 grader), intervjun som en bokad dag i kalendern. -->
  <path d="M12 160C60 160 76 130 110 116S168 86 228 36" stroke="var(--illu-dim)" stroke-width="6"/>
  <!-- ansökan -->
  <rect x="20" y="100" width="44" height="56" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="6"/>
  <path d="M32 116h20M32 128h14M32 140h20" stroke="var(--illu-dim)" stroke-width="4"/>
  <!-- provbladet -->
  <g transform="rotate(-6 120 96)">
    <rect x="88" y="64" width="64" height="64" rx="10" fill="var(--illu-fill)" stroke="currentColor" stroke-width="6"/>
    <path d="M109.3 64v64M130.7 64v64M88 85.3h64M88 106.7h64" stroke="var(--illu-dim)" stroke-width="4"/>
    <rect x="134" y="110" width="14" height="14" rx="3" fill="var(--illu-accent, #E07A2F)"/>
  </g>
  <!-- intervjun: en bokad dag -->
  <rect x="176" y="24" width="48" height="44" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="6"/>
  <path d="M176 38h48" stroke="var(--illu-dim)" stroke-width="4"/>
  <path d="M188 16v12M212 16v12" stroke="currentColor" stroke-width="6"/>
  <circle cx="206" cy="54" r="5" fill="currentColor"/>
</svg>
