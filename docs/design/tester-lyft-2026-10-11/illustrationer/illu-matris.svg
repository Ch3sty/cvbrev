<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  <!-- Logik, matris. Säger: du ska hitta regeln och fylla luckan. Rutnät 3x3 med cirkel, kvadrat och triangel i latinsk kvadrat, nionde rutan tom med streckad ram, tre svarsalternativ till höger där det rätta (kvadraten) är kopparfyllt. -->
  <rect x="16" y="16" width="72" height="72" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="3"/>
  <path d="M40 16v72M64 16v72M16 40h72M16 64h72" stroke="var(--illu-dim)" stroke-width="2.5"/>
  <!-- rad 1 -->
  <circle cx="28" cy="28" r="5" fill="currentColor"/>
  <rect x="47" y="23" width="10" height="10" rx="2" fill="currentColor"/>
  <path d="M76 22.5l5.5 10h-11z" fill="currentColor"/>
  <!-- rad 2 -->
  <rect x="23" y="47" width="10" height="10" rx="2" fill="currentColor"/>
  <path d="M52 46.5l5.5 10h-11z" fill="currentColor"/>
  <circle cx="76" cy="52" r="5" fill="currentColor"/>
  <!-- rad 3, luckan -->
  <path d="M28 70.5l5.5 10h-11z" fill="currentColor"/>
  <circle cx="52" cy="76" r="5" fill="currentColor"/>
  <rect x="67" y="67" width="18" height="18" rx="4" stroke="var(--illu-dim)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <!-- svarsalternativen -->
  <rect x="104" y="16" width="40" height="24" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="3"/>
  <rect x="104" y="48" width="40" height="24" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="3"/>
  <rect x="104" y="80" width="40" height="24" rx="8" fill="var(--illu-fill)" stroke="currentColor" stroke-width="3"/>
  <circle cx="124" cy="28" r="5" fill="currentColor"/>
  <rect x="118" y="54" width="12" height="12" rx="2.5" fill="var(--illu-accent, #E07A2F)"/>
  <path d="M124 86.5l5.5 10h-11z" fill="currentColor"/>
</svg>
