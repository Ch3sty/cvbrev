<style>
  .tram { --t-kant: #C8CEEC; --t-indigo: #3B4790; width: 100%; max-width: 470px; margin: 0 auto; background: #EBEDF6; color: var(--ink-1); border-radius: 28px; border: 2px solid rgba(0, 0, 0, .08); box-shadow: 0 8px 0 rgba(0, 0, 0, .28), 0 30px 60px rgba(0, 0, 0, .3); overflow: hidden; text-align: left; }
  .tram-huvud { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
  .tram-huvud b { min-width: 0; margin-right: auto; font-family: var(--disp); font-size: 15px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tram-huvud b span { display: block; font-family: var(--text); font-weight: 500; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
  .tkryss { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 12px; background: #fff; color: var(--ink-2); box-shadow: 0 3px 0 #C8CEEC; }
  .tkryss svg { width: 16px; height: 16px; }
  .tkapsel { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 34px; padding: 0 12px; border-radius: 12px; background: #fff; color: var(--ink-1); box-shadow: 0 3px 0 #C8CEEC; font-family: var(--disp); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tkapsel i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #D5D9EC; border-top-color: var(--koppar); border-right-color: var(--koppar); }
  .tbitar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 0 14px 12px; }
  .tbitar i { height: 10px; border-radius: 5px; background: #D5D9EC; }
  .tbitar i.b { background: #3B4790; }
  .tbitar i.r { background: #2F7D5B; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
  .tbitar i.f { background: #F6D3CE; box-shadow: inset 0 0 0 2.5px #B3382E; }
  .tbitar i.nu { background: #fff; box-shadow: inset 0 0 0 3px var(--koppar); }
  .tram-kropp { padding: 4px 14px 14px; }
  .tfraga { font-family: var(--disp); font-weight: 700; font-size: 17px; line-height: 1.25; color: var(--ink-1); }
  .tram-fot { display: flex; align-items: center; gap: 12px; padding: 12px 14px 16px; background: #fff; border-top: 2px solid #DFE3F6; }
  .tram-fot .knapp { flex: 1; }
  .tram-fot .vet { font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

  /* brädet: mörk platta, vita brickor med klack, luckan streckad i koppar */
  .tbrade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 10px; border-radius: 22px; background: #1B2246; box-shadow: 0 5px 0 #0E1330; }
  .tbrade span { display: grid; place-items: center; aspect-ratio: 1; min-width: 0; border-radius: 13px; background: #fff; color: #1B2246; box-shadow: inset 0 -5px 0 #D5D9EC; font-family: var(--disp); font-weight: 800; }
  .tbrade svg { width: 56%; height: 56%; margin-top: -4%; }
  .tbrade .lucka { background: #2B3470; border: 3px dashed var(--koppar); box-shadow: none; color: var(--koppar-ljus); font-size: 26px; }
  .tbrade .fylld { background: #DCEFE5; box-shadow: inset 0 -5px 0 #A9D5BE, 0 0 0 3px #2F7D5B; }
  .tbrade.rad { grid-template-columns: repeat(5, 1fr); }

  /* svarsklossar med tangent */
  .tsvar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tsvar.s2 { grid-template-columns: repeat(2, 1fr); }
  .tsvar.s4 { grid-template-columns: repeat(4, 1fr); }
  .tsvar.s1 { grid-template-columns: 1fr; }
  .tkloss { position: relative; display: grid; place-items: center; min-width: 0; min-height: 46px; padding: 6px 8px; border-radius: 14px; background: #fff; color: var(--ink-1); border: 2px solid #C8CEEC; box-shadow: 0 4px 0 #C8CEEC; font-weight: 600; font-size: 14.5px; line-height: 1.2; text-align: center; }
  .tkloss.fig { aspect-ratio: 1; padding: 0; color: #1B2246; }
  .tkloss.fig svg { width: 52%; height: 52%; }
  .tkloss.rad { grid-template-columns: 26px 1fr; gap: 10px; place-items: center start; text-align: left; padding: 8px 12px 8px 8px; }
  .tkloss.rad .ttan { position: static; }
  .ttan { position: absolute; left: 5px; top: 5px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C8CEEC; background: #F4F5FB; color: #4A4F6A; font-family: var(--text); font-weight: 700; font-size: 11px; line-height: 1; }
  .tkloss.rad .ttan { width: 26px; height: 26px; border-radius: 8px; font-size: 12px; }
  .tkloss.vald { background: #EEF0FB; border-color: #3B4790; box-shadow: 0 4px 0 #3B4790; }
  .tkloss.vald .ttan { background: #3B4790; border-color: #3B4790; color: #fff; }
  .tkloss.ratt { background: #DCEFE5; border-color: #2F7D5B; box-shadow: 0 4px 0 #2F7D5B; }
  .tkloss.ratt .ttan { background: #2F7D5B; border-color: #2F7D5B; color: #fff; }
  .tkloss.fel { background: #FBE6E3; border-color: #B3382E; box-shadow: 0 4px 0 #B3382E; }
  .tkloss.fel .ttan { background: #B3382E; border-color: #B3382E; color: #fff; }
  .tkloss.svag { opacity: .45; }

  /* domen: förklaringen efter facit */
  .tdom { border-radius: 18px; border: 2px solid #A9D5BE; background: #DCEFE5; padding: 14px; color: var(--ink-1); text-align: left; }
  .tdom.fel { border-color: #EFBDB6; background: #FBE6E3; }
  .tdom-rad { display: flex; align-items: center; gap: 9px; font-family: var(--disp); font-weight: 800; font-size: 16px; color: #1F5C42; }
  .tdom.fel .tdom-rad { color: #8A2A22; }
  .tdom-rad svg { width: 24px; height: 24px; flex: none; }
  .tdom-rad small { margin-left: auto; font-family: var(--text); font-weight: 500; font-size: 12.5px; color: var(--ink-3); }
  .tdom-kropp { margin-top: 10px; padding: 12px 14px; border-radius: 13px; background: #fff; }
  .tdom-kropp em { display: block; font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #3B4790; }
  .tdom-kropp b { display: block; margin-top: 4px; font-family: var(--disp); font-size: 16px; line-height: 1.3; }
  .tdom-kropp p { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
  .tdom-kropp hr { border: 0; border-top: 1.5px solid #E3E1DC; margin: 10px 0; }
</style>
