<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Dekorativa cirklar -->
  <circle cx="1050" cy="80" r="280" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1130" cy="580" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="40" cy="520" r="200" fill="rgba(255,255,255,0.04)"/>

  <!-- Etikett -->
  <rect x="80" y="72" width="160" height="36" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="102" cy="90" r="5" fill="#FCD34D"/>
  <text x="116" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">CV-GUIDE</text>

  <!-- Huvudrubrik -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="white" letter-spacing="-2">Så skriver du ett CV</text>
  <text x="80" y="286" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="white" letter-spacing="-2">som leder till intervju</text>

  <!-- Undertext -->
  <text x="80" y="358" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">ATS-filter, rätt mall och formuleringar som stannar kvar</text>

  <!-- Divider -->
  <rect x="80" y="400" width="56" height="3" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Features -->
  <text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="1.2">CV-ANALYS  ·  CV-MALLAR  ·  REKRYTERINGSTESTER</text>

  <!-- CV-kort höger -->
  <rect x="820" y="80" width="300" height="390" rx="20" fill="url(#card-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <path d="M 820 80 L 1120 80 L 1120 130 L 960 166 L 820 130 Z" fill="url(#strip)" opacity="0.9"/>
  <rect x="848" y="94" width="130" height="12" rx="4" fill="white"/>
  <rect x="848" y="112" width="90" height="8" rx="3" fill="white" opacity="0.7"/>
  <rect x="848" y="186" width="80" height="9" rx="3" fill="rgba(255,255,255,0.9)"/>
  <rect x="848" y="204" width="240" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="217" width="200" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="230" width="220" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="256" width="80" height="9" rx="3" fill="rgba(255,255,255,0.9)"/>
  <rect x="848" y="274" width="240" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="287" width="180" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="300" width="210" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="326" width="80" height="9" rx="3" fill="rgba(255,255,255,0.9)"/>
  <rect x="848" y="344" width="200" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="357" width="160" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  <rect x="848" y="430" width="56" height="18" rx="9" fill="rgba(255,237,213,0.3)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <rect x="914" y="430" width="70" height="18" rx="9" fill="rgba(255,237,213,0.3)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Jobbcoach-badge -->
  <circle cx="80" cy="558" r="7" fill="#FCD34D"/>
  <text x="98" y="564" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
