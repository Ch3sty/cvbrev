<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <circle cx="1060" cy="70" r="300" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1140" cy="600" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="530" r="190" fill="rgba(255,255,255,0.04)"/>

  <!-- Etikett -->
  <rect x="80" y="72" width="150" height="36" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="102" cy="90" r="5" fill="#FCD34D"/>
  <text x="116" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">CV-MALLAR</text>

  <!-- Huvudrubrik -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="white" letter-spacing="-2">CV-mall 2026:</text>
  <text x="80" y="286" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-2">välj rätt för ditt yrke</text>

  <!-- Undertext -->
  <text x="80" y="358" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">41 mallar anpassade för svenska arbetsgivare</text>

  <!-- Divider -->
  <rect x="80" y="400" width="56" height="3" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Features -->
  <text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="1.2">VÅRD  ·  TECH  ·  EKONOMI  ·  PEDAGOGIK  ·  SERVICE</text>

  <!-- Tre CV-kort staplade höger -->
  <g transform="translate(780 60)">
    <!-- Bakre -->
    <g transform="rotate(-6 160 240)" opacity="0.65">
      <rect x="20" y="20" width="280" height="370" rx="16" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="40" y="40" width="100" height="12" rx="4" fill="#1E293B"/>
      <rect x="40" y="58" width="76" height="7" rx="3" fill="#94A3B8"/>
      <line x1="40" y1="82" x2="280" y2="82" stroke="#FB923C" stroke-width="2"/>
      <rect x="40" y="98" width="220" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="40" y="112" width="180" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="40" y="126" width="210" height="5" rx="2" fill="#CBD5E1"/>
    </g>
    <!-- Mitten -->
    <g transform="translate(60 20) rotate(1 160 240)" opacity="0.85">
      <rect x="6" y="10" width="280" height="370" rx="16" fill="rgba(0,0,0,0.12)"/>
      <rect x="0" y="0" width="280" height="370" rx="16" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="0" y="0" width="90" height="370" rx="16" fill="#1F4E5F"/>
      <rect x="90" y="0" width="6" height="370" fill="#1F4E5F"/>
      <circle cx="45" cy="52" r="24" fill="white" opacity="0.8"/>
      <rect x="12" y="90" width="66" height="7" rx="3" fill="white" opacity="0.8"/>
      <rect x="12" y="106" width="54" height="5" rx="2" fill="white" opacity="0.6"/>
      <rect x="108" y="18" width="140" height="11" rx="4" fill="#1E293B"/>
      <rect x="108" y="36" width="110" height="7" rx="3" fill="#94A3B8"/>
      <rect x="108" y="60" width="60" height="9" rx="3" fill="#0F766E"/>
      <rect x="108" y="78" width="140" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="108" y="92" width="120" height="5" rx="2" fill="#CBD5E1"/>
    </g>
    <!-- Forgrund -->
    <g transform="translate(126 10) rotate(5 160 240)">
      <rect x="6" y="10" width="280" height="370" rx="16" fill="rgba(0,0,0,0.18)"/>
      <rect x="0" y="0" width="280" height="370" rx="16" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <path d="M 0 0 L 280 0 L 280 52 L 168 82 L 0 52 Z" fill="url(#strip)"/>
      <rect x="20" y="14" width="100" height="12" rx="4" fill="white"/>
      <rect x="20" y="32" width="76" height="7" rx="3" fill="white" opacity="0.8"/>
      <circle cx="216" cy="90" r="16" fill="white" stroke="url(#strip)" stroke-width="2.5"/>
      <rect x="20" y="102" width="60" height="9" rx="3" fill="#DC2626"/>
      <rect x="20" y="120" width="220" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="20" y="134" width="180" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="20" y="148" width="210" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="20" y="172" width="190" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="20" y="348" width="50" height="16" rx="8" fill="#FFEDD5" stroke="#FED7AA"/>
      <rect x="78" y="348" width="62" height="16" rx="8" fill="#FFEDD5" stroke="#FED7AA"/>
    </g>
  </g>

  <!-- Jobbcoach-badge -->
  <circle cx="80" cy="558" r="7" fill="#FCD34D"/>
  <text x="98" y="564" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
