<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <circle cx="1060" cy="70" r="300" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1140" cy="600" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="530" r="190" fill="rgba(255,255,255,0.04)"/>

  <!-- Etikett -->
  <rect x="80" y="72" width="140" height="36" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="102" cy="90" r="5" fill="#FCD34D"/>
  <text x="116" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">AI-VERKTYG</text>

  <!-- Huvudrubrik -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="white" letter-spacing="-2">Så söker du jobb</text>
  <text x="80" y="286" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="white" letter-spacing="-2">med AI</text>

  <!-- Undertext -->
  <text x="80" y="358" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Verktyget som sparar dig timmar varje vecka</text>

  <!-- Divider -->
  <rect x="80" y="400" width="56" height="3" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Features -->
  <text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="1.2">PERSONLIGT BREV  ·  JOBBMATCHNING  ·  CV-ANALYS</text>

  <!-- Höger: "J"-kort -->
  <rect x="840" y="80" width="260" height="390" rx="20" fill="url(#card-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="970" y="320" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="900" fill="white" text-anchor="middle" opacity="0.92">J</text>
  <text x="970" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">JOBBCOACH.AI</text>

  <!-- Jobbcoach-badge -->
  <circle cx="80" cy="558" r="7" fill="#FCD34D"/>
  <text x="98" y="564" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
