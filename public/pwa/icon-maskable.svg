<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jobbcoach">
  <title>Jobbcoach</title>
  <!--
    Maskable: Android beskär till cirkel, squircle eller rundad kvadrat.
    Bakgrunden fyller därför hela ytan utan hörnradie, och motivet ryms inom
    den säkra cirkeln på 80 procent, alltså radie 205 från mitten.

    Motivet är samma som icon.svg, skalat till 0,78 och centrerat. Största
    avståndet från mitten blir då cirka 196 px, med marginal innanför den
    säkra cirkeln.
  -->
  <rect width="512" height="512" fill="#EDE8DF"/>

  <g transform="translate(256 256) scale(0.78) translate(-262 -248)">
    <g fill="#EDE8DF" stroke="#1C1917" stroke-width="35.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132 312V240a20 20 0 0 1 20-20h56l26 26h146a20 20 0 0 1 20 20v46z"/>
      <g transform="rotate(-8 266 176)">
        <rect x="200" y="76" width="134" height="174" rx="22"/>
      </g>
      <path d="M104 306h304l-30 100a20 20 0 0 1-19 14H153a20 20 0 0 1-19-14z"/>
    </g>
    <circle cx="380" cy="128" r="46" fill="#D9480F"/>
    <path d="M380 150v-44M362 124l18-18 18 18" fill="none" stroke="#FFFFFF" stroke-width="30.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
