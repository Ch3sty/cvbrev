<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Jobbcoach Premium, Stripe-produktbild. Rummen v3: fyra väggar möts i ett hörn,
       ett graverat kopparmärke med J, ordmärket i Schibsted Grotesk som paths. -->
  <defs>
    <linearGradient id="vTran" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2B3470"/>
      <stop offset="0.48" stop-color="#1B2246"/>
      <stop offset="1" stop-color="#121737"/>
    </linearGradient>
    <linearGradient id="vCv" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1D4D51"/>
      <stop offset="0.48" stop-color="#113538"/>
      <stop offset="1" stop-color="#0B2628"/>
    </linearGradient>
    <linearGradient id="vBrev" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#56284A"/>
      <stop offset="0.48" stop-color="#3A1930"/>
      <stop offset="1" stop-color="#280F22"/>
    </linearGradient>
    <linearGradient id="vJobb" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2A4C37"/>
      <stop offset="0.48" stop-color="#1B3324"/>
      <stop offset="1" stop-color="#112219"/>
    </linearGradient>
    <radialGradient id="ljus" gradientUnits="userSpaceOnUse" cx="870" cy="-102" r="614"
      gradientTransform="translate(870 -102) scale(2 1) translate(-870 102)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skugga" gradientUnits="userSpaceOnUse" cx="512" cy="480" r="324">
      <stop offset="0.71" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.83" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0A061"/>
      <stop offset="0.5" stop-color="#D9702A"/>
      <stop offset="1" stop-color="#9E4515"/>
    </linearGradient>
    <linearGradient id="markeKant" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD9B8"/>
      <stop offset="1" stop-color="#B55A1E"/>
    </linearGradient>
  </defs>

  <!-- Väggarna: Träningen uppe, Personliga brev höger, Jobbsöket nere, CV vänster -->
  <polygon points="0,0 1024,0 512,440" fill="url(#vTran)"/>
  <polygon points="1024,0 1024,1024 512,440" fill="url(#vBrev)"/>
  <polygon points="1024,1024 0,1024 512,440" fill="url(#vJobb)"/>
  <polygon points="0,1024 0,0 512,440" fill="url(#vCv)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#ljus)"/>

  <!-- Skarvarna: skuggkant och ljuskant, som väggens kant i rummen -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#000000" stroke-opacity="0.28" stroke-width="7">
      <path d="M0 0 L512 440 L1024 0"/>
      <path d="M0 1024 L512 440 L1024 1024"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2.5">
      <path d="M0 0 L512 440 L1024 0"/>
      <path d="M0 1024 L512 440 L1024 1024"/>
    </g>
  </g>

  <!-- Märket: graverad kopparplatta med ljuskant och skuggkant (m-bas), lyft från väggen -->
  <circle cx="512" cy="480" r="324" fill="url(#skugga)"/>
  <circle cx="512" cy="440" r="260" fill="url(#marke)"/>
  <circle cx="512" cy="440" r="256.5" fill="none" stroke="url(#markeKant)" stroke-width="7" opacity="0.8"/>
  <circle cx="512" cy="440" r="218.21" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4.5"/>
  <circle cx="512" cy="440" r="204.29" fill="none" stroke="#5A2708" stroke-opacity="0.35" stroke-width="4.5"/>

