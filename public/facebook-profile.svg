<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Bakgrund -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Subtil glans -->
  <rect width="400" height="400" fill="url(#shine)"/>
  <!-- Dekorativ cirkel bakre -->
  <circle cx="340" cy="60" r="140" fill="rgba(255,255,255,0.06)"/>
  <circle cx="60" cy="340" r="120" fill="rgba(255,255,255,0.06)"/>

  <!-- J-bokstav -->
  <text
    x="200"
    y="255"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="220"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-8"
  >J</text>

  <!-- Prick under J -->
  <circle cx="200" cy="310" r="18" fill="rgba(255,255,255,0.35)"/>
</svg>
