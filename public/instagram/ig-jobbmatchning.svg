<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="piece1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="piece2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- Illustration: två enkla kort som möts med en match-check -->
  <g transform="translate(540 270) scale(1.0) translate(-320 -180)">

    <!-- CV-kort (vänster) -->
    <g transform="translate(0 20) rotate(-3 160 180)">
      <rect x="4" y="8" width="300" height="340" rx="16" fill="rgba(0,0,0,0.18)"/>
      <rect x="0" y="0" width="300" height="340" rx="16" fill="white"/>
      <rect x="0" y="0" width="300" height="7" rx="3" fill="url(#piece1)"/>
      <circle cx="50" cy="55" r="28" fill="url(#piece1)"/>
      <rect x="90" y="40" width="140" height="12" rx="4" fill="#1E293B"/>
      <rect x="90" y="60" width="110" height="8" rx="3" fill="#94A3B8"/>
      <line x1="24" y1="100" x2="276" y2="100" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="24" y="118" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="132" width="220" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="146" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="176" width="60" height="18" rx="9" fill="#FFEDD5" stroke="#FED7AA"/>
      <rect x="90" y="176" width="60" height="18" rx="9" fill="#FFEDD5" stroke="#FED7AA"/>
      <rect x="156" y="176" width="60" height="18" rx="9" fill="#FFEDD5" stroke="#FED7AA"/>
      <rect x="24" y="214" width="70" height="8" rx="3" fill="#1E293B"/>
      <rect x="24" y="230" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="244" width="200" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="280" width="70" height="8" rx="3" fill="#1E293B"/>
      <rect x="24" y="296" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="310" width="180" height="6" rx="3" fill="#CBD5E1"/>
    </g>

    <!-- Jobb-kort (höger) -->
    <g transform="translate(340 40) rotate(3 160 160)">
      <rect x="4" y="8" width="300" height="280" rx="16" fill="rgba(0,0,0,0.18)"/>
      <rect x="0" y="0" width="300" height="280" rx="16" fill="white"/>
      <rect x="0" y="0" width="300" height="7" rx="3" fill="url(#piece2)"/>
      <rect x="24" y="24" width="48" height="48" rx="10" fill="#FED7AA"/>
      <rect x="84" y="28" width="160" height="12" rx="4" fill="#1E293B"/>
      <rect x="84" y="48" width="120" height="8" rx="3" fill="#94A3B8"/>
      <line x1="24" y1="88" x2="276" y2="88" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="24" y="106" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="120" width="210" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="134" width="252" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="148" width="180" height="6" rx="3" fill="#CBD5E1"/>
      <rect x="24" y="180" width="130" height="32" rx="16" fill="url(#piece2)"/>
    </g>

    <!-- Match-check i mitten -->
    <circle cx="340" cy="240" r="44" fill="white" opacity="0.95"/>
    <circle cx="340" cy="240" r="36" fill="#FCD34D"/>
    <path d="M 322 240 L 336 254 L 358 226" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="228" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">JOBBMATCHNING</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Hitta jobb som</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">matchar dig</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Vi matchar din profil mot tusentals annonser</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
