<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- Test-kort med 3x3 matrix, kompakt och centrerat -->
  <g transform="translate(540 270) translate(-200 -200)">
    <rect x="4" y="8" width="396" height="410" rx="20" fill="rgba(0,0,0,0.20)"/>
    <rect x="0" y="0" width="396" height="410" rx="20" fill="white"/>
    <rect x="0" y="0" width="396" height="8" rx="4" fill="url(#strip)"/>

    <!-- Header -->
    <rect x="28" y="28" width="150" height="14" rx="4" fill="#1E293B"/>
    <rect x="28" y="50" width="110" height="7" rx="3" fill="#94A3B8"/>
    <rect x="28" y="72" width="56" height="20" rx="10" fill="#FFEDD5" stroke="#FED7AA"/>
    <rect x="92" y="72" width="76" height="20" rx="10" fill="#FFEDD5" stroke="#FED7AA"/>

    <!-- 3x3 matrix, 3 cols x 3 rows, cellsize 90x80 -->
    <g transform="translate(28 110)">
      <!-- Row 0 -->
      <rect x="0"   y="0"  width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="112" y="0"  width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="224" y="0"  width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <!-- Row 1 -->
      <rect x="0"   y="96" width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="112" y="96" width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="224" y="96" width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <!-- Row 2 -->
      <rect x="0"   y="192" width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="112" y="192" width="100" height="84" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
      <!-- Sista: highlight med ? -->
      <rect x="224" y="192" width="100" height="84" rx="10" fill="url(#tile)"/>

      <!-- Mönster rad 0: 1, 2, 3 prickar -->
      <circle cx="50" cy="42" r="8" fill="url(#tile)"/>
      <circle cx="156" cy="34" r="7" fill="url(#tile)"/>
      <circle cx="168" cy="50" r="7" fill="url(#tile)"/>
      <circle cx="262" cy="30" r="6" fill="url(#tile)"/>
      <circle cx="280" cy="42" r="6" fill="url(#tile)"/>
      <circle cx="262" cy="54" r="6" fill="url(#tile)"/>

      <!-- Mönster rad 1: diagonaler + rektangel -->
      <line x1="22" y1="110" x2="78" y2="166" stroke="url(#tile)" stroke-width="7" stroke-linecap="round"/>
      <line x1="134" y1="110" x2="190" y2="166" stroke="url(#tile)" stroke-width="7" stroke-linecap="round"/>
      <line x1="190" y1="110" x2="134" y2="166" stroke="url(#tile)" stroke-width="7" stroke-linecap="round"/>
      <rect x="246" y="116" width="56" height="56" rx="8" fill="none" stroke="url(#tile)" stroke-width="4"/>

      <!-- Mönster rad 2 -->
      <circle cx="50" cy="234" r="18" fill="none" stroke="url(#tile)" stroke-width="4"/>
      <line x1="134" y1="210" x2="190" y2="266" stroke="url(#tile)" stroke-width="7" stroke-linecap="round"/>
      <line x1="190" y1="210" x2="134" y2="266" stroke="url(#tile)" stroke-width="7" stroke-linecap="round"/>

      <!-- ? i sista cellen -->
      <text x="274" y="248" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="310" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">REKRYTERINGSTESTER</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Träna inför provet</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">innan det gäller</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.85)">Matrislogik · Verbal · Numerisk · Personlighet</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
