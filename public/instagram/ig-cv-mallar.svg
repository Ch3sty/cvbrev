<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- Tre CV-mallar, staplade, alla synliga, i övre halvan -->
  <g transform="translate(540 280) translate(-280 -180)">

    <!-- Bakre: Minimal -->
    <g transform="translate(0 0) rotate(-6 130 180)" opacity="0.7">
      <rect x="0" y="0" width="260" height="340" rx="14" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="18" y="18" width="90" height="10" rx="3" fill="#1E293B"/>
      <rect x="18" y="34" width="70" height="6" rx="3" fill="#94A3B8"/>
      <line x1="18" y1="56" x2="242" y2="56" stroke="#FB923C" stroke-width="2"/>
      <rect x="18" y="72" width="200" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="84" width="170" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="96" width="200" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="120" width="180" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="132" width="160" height="5" rx="2" fill="#CBD5E1"/>
    </g>

    <!-- Mitten: Nordic med sidofält -->
    <g transform="translate(130 20) rotate(1 130 180)" opacity="0.88">
      <rect x="4" y="8" width="260" height="340" rx="14" fill="rgba(0,0,0,0.14)"/>
      <rect x="0" y="0" width="260" height="340" rx="14" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <rect x="0" y="0" width="88" height="340" fill="#1F4E5F"/>
      <circle cx="44" cy="52" r="22" fill="white" opacity="0.85"/>
      <rect x="10" y="86" width="68" height="6" rx="3" fill="white" opacity="0.85"/>
      <rect x="10" y="100" width="56" height="4" rx="2" fill="white" opacity="0.65"/>
      <rect x="10" y="140" width="48" height="6" rx="3" fill="white" opacity="0.85"/>
      <rect x="10" y="154" width="60" height="4" rx="2" fill="white" opacity="0.65"/>
      <rect x="104" y="18" width="130" height="10" rx="3" fill="#1E293B"/>
      <rect x="104" y="34" width="100" height="6" rx="3" fill="#94A3B8"/>
      <rect x="104" y="56" width="56" height="8" rx="3" fill="#0F766E"/>
      <rect x="104" y="72" width="130" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="104" y="84" width="110" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="104" y="96" width="130" height="4" rx="2" fill="#CBD5E1"/>
    </g>

    <!-- Förgrund: Creative med färgad header -->
    <g transform="translate(270 10) rotate(5 130 180)">
      <rect x="4" y="8" width="260" height="340" rx="14" fill="rgba(0,0,0,0.20)"/>
      <rect x="0" y="0" width="260" height="340" rx="14" fill="white" stroke="#FED7AA" stroke-width="1.5"/>
      <path d="M 0 0 L 260 0 L 260 46 L 156 74 L 0 46 Z" fill="url(#strip)"/>
      <rect x="18" y="12" width="90" height="10" rx="3" fill="white"/>
      <rect x="18" y="28" width="70" height="6" rx="3" fill="white" opacity="0.85"/>
      <circle cx="192" cy="80" r="13" fill="white" stroke="url(#strip)" stroke-width="2.5"/>
      <rect x="18" y="90" width="55" height="8" rx="3" fill="#DC2626"/>
      <rect x="18" y="106" width="200" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="118" width="170" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="130" width="200" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="160" width="180" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="172" width="160" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="18" y="314" width="46" height="14" rx="7" fill="#FFEDD5" stroke="#FED7AA"/>
      <rect x="70" y="314" width="56" height="14" rx="7" fill="#FFEDD5" stroke="#FED7AA"/>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="190" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">CV-MALLAR</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Professionella</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">CV-mallar</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Modern, traditionell och kreativ stil</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
