<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- Två chat-bubblor, kompakta, klart separerade från text -->
  <g transform="translate(540 120) translate(-300 0)">

    <!-- Fråge-bubbla (vit) -->
    <g>
      <path d="M 12 0 L 588 0 Q 600 0 600 12 L 600 110 Q 600 122 588 122 L 80 122 L 56 148 L 56 122 L 12 122 Q 0 122 0 110 L 0 12 Q 0 0 12 0 Z" fill="white" stroke="#FED7AA" stroke-width="2"/>
      <rect x="24" y="24" width="260" height="9" rx="3" fill="#1E293B"/>
      <rect x="24" y="42" width="500" height="7" rx="3" fill="#94A3B8"/>
      <rect x="24" y="56" width="460" height="7" rx="3" fill="#94A3B8"/>
      <rect x="24" y="82" width="80" height="24" rx="12" fill="#FFEDD5"/>
      <rect x="112" y="82" width="80" height="24" rx="12" fill="#FFEDD5"/>
    </g>

    <!-- Svar-bubbla (gradient) -->
    <g transform="translate(0 178)">
      <path d="M 0 12 Q 0 0 12 0 L 588 0 Q 600 0 600 12 L 600 220 Q 600 232 588 232 L 80 232 L 56 258 L 56 232 L 12 232 Q 0 232 0 220 Z" fill="url(#bubble)"/>
      <path d="M 0 12 Q 0 0 12 0 L 588 0 Q 600 0 600 12 L 600 18 L 0 18 Z" fill="#FCD34D" opacity="0.8"/>

      <!-- Coach avatar -->
      <circle cx="44" cy="56" r="24" fill="white" opacity="0.95"/>
      <circle cx="44" cy="48" r="8" fill="#DC2626"/>
      <path d="M 30 68 Q 30 58 44 58 Q 58 58 58 68" fill="#DC2626"/>

      <rect x="84" y="38" width="200" height="10" rx="3" fill="white"/>
      <rect x="84" y="56" width="140" height="8" rx="3" fill="white" opacity="0.85"/>

      <rect x="28" y="96" width="544" height="8" rx="3" fill="white" opacity="0.95"/>
      <rect x="28" y="114" width="520" height="8" rx="3" fill="white" opacity="0.95"/>
      <rect x="28" y="132" width="420" height="8" rx="3" fill="white" opacity="0.95"/>

      <rect x="28" y="166" width="100" height="26" rx="13" fill="rgba(255,255,255,0.25)"/>
      <rect x="136" y="166" width="100" height="26" rx="13" fill="rgba(255,255,255,0.25)"/>
      <rect x="244" y="166" width="100" height="26" rx="13" fill="rgba(255,255,255,0.25)"/>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="210" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">KARRIARGUIDEN</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Karriärrådgivning</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">med källor</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Lön · Intervju · Arbetsrätt · Karriärbyte</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
