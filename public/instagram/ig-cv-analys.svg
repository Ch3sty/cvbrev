<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="loupe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- CV-kort, litet och centrerat, inga bakgrunds-CV som sticker ut -->
  <g transform="translate(540 270) translate(-190 -200)">

    <!-- Enda CV-kortet, rakt och centrerat -->
    <rect x="4" y="8" width="360" height="420" rx="20" fill="rgba(0,0,0,0.20)"/>
    <rect x="0" y="0" width="360" height="420" rx="20" fill="white"/>
    <rect x="0" y="0" width="360" height="8" rx="4" fill="url(#strip)"/>

    <!-- Header -->
    <circle cx="60" cy="66" r="30" fill="url(#loupe)"/>
    <rect x="104" y="48" width="170" height="14" rx="4" fill="#1E293B"/>
    <rect x="104" y="70" width="130" height="8" rx="3" fill="#94A3B8"/>
    <line x1="24" y1="114" x2="336" y2="114" stroke="#FED7AA" stroke-width="1.5"/>

    <!-- Grønn highlight -->
    <rect x="20" y="130" width="320" height="52" rx="8" fill="#D1FAE5" opacity="0.6"/>
    <rect x="28" y="142" width="180" height="8" rx="3" fill="#475569"/>
    <rect x="28" y="158" width="260" height="6" rx="3" fill="#94A3B8"/>
    <circle cx="326" cy="156" r="13" fill="#10B981"/>
    <path d="M 320 156 L 325 161 L 333 150" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Orange highlight -->
    <rect x="20" y="192" width="320" height="52" rx="8" fill="#FFEDD5" opacity="0.7"/>
    <rect x="28" y="204" width="150" height="8" rx="3" fill="#475569"/>
    <rect x="28" y="220" width="270" height="6" rx="3" fill="#94A3B8"/>
    <circle cx="326" cy="218" r="13" fill="#F97316"/>
    <path d="M 326 224 L 326 212 M 321 217 L 326 212 L 331 217" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Normal rad -->
    <rect x="28" y="260" width="160" height="8" rx="3" fill="#475569"/>
    <rect x="28" y="276" width="300" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="28" y="290" width="260" height="6" rx="3" fill="#CBD5E1"/>

    <!-- Score-bar -->
    <rect x="28" y="340" width="304" height="16" rx="8" fill="#FFEDD5"/>
    <rect x="28" y="340" width="248" height="16" rx="8" fill="url(#strip)"/>
    <rect x="28" y="368" width="36" height="6" rx="3" fill="#94A3B8"/>
    <rect x="296" y="368" width="36" height="6" rx="3" fill="#DC2626"/>

    <!-- Förstoringsglas uppe till höger -->
    <g transform="translate(296 -60)">
      <circle cx="48" cy="48" r="44" fill="white" opacity="0.95"/>
      <circle cx="48" cy="48" r="30" stroke="url(#loupe)" stroke-width="6" fill="none"/>
      <line x1="70" y1="70" x2="88" y2="88" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
      <rect x="44" y="34" width="8" height="18" rx="3" fill="#DC2626"/>
      <circle cx="48" cy="60" r="4" fill="#DC2626"/>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="190" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">CV-ANALYS</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Förbättra ditt CV</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">på 60 sekunder</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Konkret feedback, ingen gissning</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
