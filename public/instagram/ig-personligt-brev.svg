<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- Brev-kort, ett enda rakt dokument -->
  <g transform="translate(540 270) translate(-185 -210)">
    <rect x="4" y="8" width="370" height="440" rx="20" fill="rgba(0,0,0,0.20)"/>
    <rect x="0" y="0" width="370" height="440" rx="20" fill="white"/>
    <rect x="0" y="0" width="370" height="8" rx="4" fill="url(#strip)"/>

    <!-- Header -->
    <rect x="30" y="36" width="160" height="14" rx="4" fill="url(#name)"/>
    <rect x="30" y="58" width="200" height="7" rx="3" fill="#94A3B8"/>
    <rect x="30" y="72" width="160" height="7" rx="3" fill="#94A3B8"/>

    <!-- Subjekt -->
    <rect x="30" y="108" width="270" height="11" rx="3" fill="#1E293B"/>

    <!-- Hälsning -->
    <rect x="30" y="136" width="110" height="8" rx="3" fill="#475569"/>

    <!-- Paragrafer -->
    <rect x="30" y="162" width="310" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="177" width="298" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="192" width="305" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="207" width="270" height="7" rx="3" fill="#475569" opacity="0.85"/>

    <rect x="30" y="233" width="310" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="248" width="285" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="263" width="300" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="278" width="260" height="7" rx="3" fill="#475569" opacity="0.85"/>

    <rect x="30" y="304" width="310" height="7" rx="3" fill="#475569" opacity="0.85"/>
    <rect x="30" y="319" width="230" height="7" rx="3" fill="#475569" opacity="0.85"/>

    <!-- Signatur -->
    <path d="M 30 370 Q 52 358 74 370 T 118 370 Q 140 358 162 370" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="30" y="390" width="110" height="7" rx="3" fill="#94A3B8"/>

    <!-- Anpassad-badge -->
    <g transform="translate(220 36)">
      <rect x="0" y="0" width="124" height="44" rx="10" fill="white" stroke="url(#strip)" stroke-width="2"/>
      <rect x="0" y="0" width="124" height="4" rx="2" fill="url(#strip)"/>
      <circle cx="18" cy="22" r="9" fill="url(#strip)"/>
      <path d="M 14 22 L 18 26 L 24 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="34" y="16" width="78" height="6" rx="3" fill="#1E293B"/>
      <rect x="34" y="28" width="60" height="5" rx="2" fill="#94A3B8"/>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="240" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">PERSONLIGT BREV</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Brev som matchar</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">varje jobb</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Skräddarsydd ansökan på 60 sekunder</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
