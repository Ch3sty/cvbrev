<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="white" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="960" r="200" fill="rgba(255,255,255,0.05)"/>

  <!-- CV-byggare, ett rakt kort -->
  <g transform="translate(540 270) translate(-185 -210)">
    <rect x="4" y="8" width="370" height="430" rx="20" fill="rgba(0,0,0,0.20)"/>
    <rect x="0" y="0" width="370" height="430" rx="20" fill="white"/>
    <rect x="0" y="0" width="370" height="8" rx="4" fill="url(#strip)"/>

    <!-- Avatar placeholder -->
    <circle cx="60" cy="66" r="30" stroke="url(#plus)" stroke-width="3" stroke-dasharray="6 4" fill="#FFEDD5"/>
    <line x1="60" y1="52" x2="60" y2="80" stroke="url(#plus)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="66" x2="74" y2="66" stroke="url(#plus)" stroke-width="3" stroke-linecap="round"/>

    <rect x="104" y="50" width="170" height="14" rx="4" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="104" y="72" width="130" height="8" rx="3" fill="#FED7AA"/>

    <line x1="24" y1="112" x2="346" y2="112" stroke="#FED7AA" stroke-width="1.5"/>

    <!-- Sektion 1: ifylld -->
    <rect x="24" y="130" width="90" height="9" rx="3" fill="#1E293B"/>
    <rect x="24" y="150" width="170" height="7" rx="3" fill="#475569"/>
    <rect x="24" y="164" width="120" height="6" rx="3" fill="#94A3B8"/>
    <rect x="24" y="180" width="320" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="24" y="192" width="280" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- Sektion 2: tom placeholder -->
    <rect x="24" y="220" width="78" height="9" rx="3" fill="#1E293B"/>
    <rect x="24" y="242" width="322" height="54" rx="8" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1.5" stroke-dasharray="6 4"/>

    <line x1="24" y1="316" x2="346" y2="316" stroke="#FED7AA" stroke-width="1.5"/>

    <!-- Pills -->
    <rect x="24" y="334" width="90" height="9" rx="3" fill="#1E293B"/>
    <rect x="24" y="354" width="74" height="24" rx="12" fill="#FFEDD5" stroke="#FED7AA"/>
    <rect x="106" y="354" width="64" height="24" rx="12" fill="#FFEDD5" stroke="#FED7AA"/>
    <rect x="178" y="354" width="44" height="24" rx="12" fill="white" stroke="#FED7AA" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Plus-badge -->
    <g transform="translate(282 -52)">
      <circle cx="52" cy="52" r="48" fill="white" opacity="0.95"/>
      <circle cx="52" cy="52" r="40" fill="url(#plus)"/>
      <line x1="52" y1="34" x2="52" y2="70" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <line x1="34" y1="52" x2="70" y2="52" stroke="white" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Text-sektion -->
  <rect x="100" y="660" width="185" height="38" rx="19" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="122" cy="679" r="5" fill="#FCD34D"/>
  <text x="137" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="2">SKAPA CV</text>

  <text x="100" y="766" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">Ditt CV klart</text>
  <text x="100" y="856" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">på minuter</text>

  <text x="100" y="918" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)">Gratis, ATS-säkert, PDF och Word</text>

  <circle cx="100" cy="988" r="7" fill="#FCD34D"/>
  <text x="118" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="white" opacity="0.95">jobbcoach.ai</text>
</svg>
